trigger:
  branches:
    include:
      - dev
  paths:
    exclude:
      - '*'

pr:
  branches:
    include:
      - dev



pool:
  vmImage: 'ubuntu-latest'

variables:
- group: vgdevadb360


jobs:
- deployment: Deploy
  displayName: 'Install Cluster'
  environment: 'dev'
  pool:
    vmImage: 'ubuntu-latest'
  
  strategy:
    runOnce:
      deploy:
        
        steps:
        - checkout: self

        - task: CmdLine@2
          inputs:
            script: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
        - task: AzureCLI@2
          displayName: 'Call script to create a cluster'
          inputs:
            azureSubscription: 'ado-sc'
            scriptType: 'bash'
            scriptLocation: 'scriptPath'
            scriptPath: './helpers/create-cluster.sh'
            arguments: '$(resourceGroupName) $(tenantId) $(clientId) $(clientSecret) $(clusterconf)'
  