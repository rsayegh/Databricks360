# This is a Databricks asset bundle definition for adb360_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: adb360_bundle

include:
  - resources/*.yml

run_as:
  service_principal_name: adb360-sp


variables:
  emailrecipient: 
    description: email address of the recipient of failure notifications
    default: admin@MngEnvMCAP471958.onmicrosoft.com
  devworkspace:
    description: workspace url for dev
    default: https://adb-2882014827761272.12.azuredatabricks.net
  prdworkspace:
    description: workspace url for prod
    default: https://adb-406777880185287.7.azuredatabricks.net
  username:
    description: adb360-sp uid
    default: 61dff72b-e741-4725-89a1-39ce3a2edb81
  bronzestorageaccountname:
    description: the storage account name for bronze
    default: adb3600613bronzesa
  catalogname:
    description: the catalog to use
    default: catadb360dev
  schemaname:
    description: the schema to use
    default: schemaadb360dev

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    variables:
      bronzestorageaccountname: adb3600613bronzesa

      
    mode: development
    default: true
    workspace:
      host: https://adb-2882014827761272.12.azuredatabricks.net

    run_as:
      service_principal_name: ${var.username}
